vicinote:
  name:
    en: "VicinoTe"
    it: "VicinoTe"
  description:
    en: "A from-scratch Rails tutorial building a local services marketplace, from the first `rails new` to an AI-powered advanced module."
    it: "Un tutorial Rails da zero che costruisce un marketplace di servizi locali, dal primo `rails new` fino a un modulo avanzato basato sull'AI."
ai-with-ruby:
  name:
    en: "AI with Ruby"
    it: "AI con Ruby"
  description:
    en: "Bringing AI features into Ruby and Rails applications with RubyLLM: chatbots, semantic search, and tool calling."
    it: "Portare funzionalità di AI nelle applicazioni Ruby e Rails con RubyLLM: chatbot, ricerca semantica e tool calling."
ruby-deep-dive:
  name:
    en: "Ruby Deep Dive"
    it: "Ruby Deep Dive"
  description:
    en: "A from-scratch look at the Ruby language itself, not a framework — with hands-on exercises for every episode."
    it: "Uno sguardo da zero al linguaggio Ruby in sé, non a un framework — con esercizi pratici per ogni episodio."
semantic-seo:
  name:
    en: "Semantic SEO"
    it: "SEO Semantica"
  description:
    en: "Beyond the keyword: how search engines actually rank content today, for anyone who writes online."
    it: "Oltre la keyword: come i motori di ricerca posizionano davvero i contenuti oggi, per chiunque scriva online."
whatsapp-with-rails:
  name:
    en: "WhatsApp with Rails"
    it: "WhatsApp con Rails"
  description:
    en: "Sending WhatsApp messages from a Rails app — first via Twilio, then via a direct Meta WhatsApp Cloud API variant for comparison."
    it: "Inviare messaggi WhatsApp da un'app Rails — prima via Twilio, poi con una variante diretta con le API Meta WhatsApp Cloud, per confronto."
